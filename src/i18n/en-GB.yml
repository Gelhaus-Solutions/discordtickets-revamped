buttons:
  accept_close_request:
    emoji: ✅
    text: Accept
  cancel:
    emoji: ➖
    text: Cancel
  claim:
    emoji: 🙌
    text: Claim
  close:
    emoji: ✖️
    text: Close
  confirm_close:
    emoji: ✖️
    text: Close it
  confirm_open:
    emoji: ✅
    text: Create ticket
  create:
    emoji: 🎫
    text: Create a ticket
  edit:
    emoji: ✏️
    text: Edit
  reject_close_request:
    emoji: ✖️
    text: Reject
  reopen:
    emoji: 🔓
    text: Reopen
  transcript:
    emoji: 📄
    text: Transcript
  unclaim:
    emoji: ♻️
    text: Release
commands:
  message:
    create:
      name: Create ticket from message
    pin:
      name: Pin message
      not_pinnable:
        description: |
          This message can't be pinned.
          Please ask an administrator to check the bot's permissions.
        title: ❌ Error
      not_ticket:
        description: You can only pin messages in tickets.
        title: ❌ This isn't a ticket channel
      pinned:
        description: The message has been pinned.
        title: ✅ Pinned message
  slash:
    add:
      added: ➡️ {added} has been added by {by}.
      description: Add a member to a ticket
      name: add
      not_staff:
        description: Only staff members can add members to others' tickets.
        title: ❌ Error
      options:
        member:
          description: The member to add to the ticket
          name: member
        ticket:
          description: The ticket to add the member to
          name: ticket
      success:
        description: "{member} has been added to {ticket}."
        title: ✅ Added
    claim:
      description: Claim a ticket
      name: claim
      not_staff:
        description: Only staff members can claim tickets.
        title: ❌ Error
    close:
      description: Request a ticket to be closed
      invalid_time:
        description: "`{input}` is not a valid time format."
        title: ❌ Invalid
      name: close
      options:
        reason:
          description: The reason for closing the ticket
          name: reason
    emoji:
      cleared:
        description: This ticket's emoji has been cleared.
        title: ✅ Emoji cleared
      deferred:
        description:
          This channel has been renamed twice in the last 10 minutes, so the new
          emoji will be applied automatically once the limit resets.
        title: ⏳ Queued
      description: Set or clear a ticket's emoji
      invalid:
        description:
          That is not an emoji Discord can show in a channel name. Server emoji
          cannot be used here.
        title: ❌ Invalid emoji
      name: emoji
      not_staff:
        description: Only staff members can change a ticket's emoji.
        title: ❌ Error
      nothing_to_do:
        description: "Provide an emoji, or use `clear: True` to remove the current one."
        title: ❌ Error
      options:
        clear:
          description: Remove the ticket's emoji instead of setting one
          name: clear
        emoji:
          description: The emoji to show at the start of the channel name
          name: emoji
        scope:
          choices:
            all: Replace the whole prefix
            state: Keep the priority emoji
          description: Whether the emoji replaces the priority emoji too
          name: scope
      success:
        description: This ticket's emoji has been set to {emoji}.
        title: ✅ Emoji set
    escalate:
      description: Escalate a ticket to a different category
      escalated: ⚠️ {by} has escalated this ticket from **{from}** to **{to}**.{reason}
      name: escalate
      no_category:
        The selected category no longer exists. Pick another one from the
        autocomplete list.
      not_staff:
        description: Only staff members can escalate tickets.
        title: ❌ Error
      options:
        category:
          description: The category to escalate the ticket to
          name: category
        reason:
          description: The reason for escalating the ticket
          name: reason
    force-close:
      closed_one:
        description: The ticket will be closed in a few seconds.
        title: ✅ Ticket closed
      confirm_multiple:
        description: >
          You are about to close **{count}** tickets that have been inactive
          for more than `{time}`:

          {tickets}
        title: ❓ Are you sure?
      confirmed_multiple:
        description: The tickets will be closed in a few seconds.
        title:
          - ✅ Closing %d ticket
          - ✅ Closing %d tickets
      description: Forcibly close a ticket
      name: force-close
      no_tickets:
        description: >-
          There are no open tickets that have been inactive for more than
          `{time}`.
        title: ❌ No tickets
      not_staff:
        description: Only staff members can force-close tickets.
        title: ❌ Error
      options:
        category:
          description:
            Close all tickets in the specified category (must be used with
            `time`)
          name: category
        lock:
          description:
            Also lock the thread so nobody can reply (threads are only archived
            by default)
          name: lock
        reason:
          description: The reason for closing the ticket(s)
          name: reason
        ticket:
          description: The ticket to close
          name: ticket
        time:
          description: Close all tickets that have been inactive for the specified time
          name: time
    help:
      description: Show the help menu
      name: help
      response:
        commands: Commands
        description: "**Use {command} to create a ticket and get support.**"
        links:
          commands: Full command list
          docs: Documentation
          feedback: Feedback
          links: Useful links
          support: Support
        settings: Bot settings
      title: Help
    move:
      description: Move a ticket to another category
      moved: 🗃️ {by} has moved this ticket from **{from}** to **{to}**.
      name: move
      not_staff:
        description: Only staff members can move tickets.
        title: ❌ Error
      options:
        category:
          description: The category to move the ticket to
          name: category
    new:
      description: Create a new ticket
      name: new
      options:
        references:
          description: The number of a related ticket
          name: references
    private-channel:
      channel_limit:
        description:
          There is no room for another channel here. Ask an administrator to
          free one up, or to point staff channels at a different category.
        title: ❌ Error
      closed:
        description: This ticket is closed, so there is nothing to open a staff channel beside.
        title: ❌ Error
      description: Open a private staff channel for this ticket
      failed:
        description: The staff channel could not be created. Please try again.
        title: ❌ Error
      missing_permission:
        description:
          The bot cannot create the staff channel. Check that it still has
          Manage Channels, and Manage Threads if the channel is a thread.
        title: ❌ Error
      name: private-channel
      no_staff_roles:
        description:
          This ticket's category has no staff roles, so nobody could see the
          channel. Set one in the dashboard first.
        title: ❌ Error
      not_staff:
        description: Only staff members can open a private staff channel.
        title: ❌ Error
      success:
        created:
          description: "{channel} is private to staff, and goes away when this ticket closes."
          title: 🔒 Staff channel opened
        exists:
          description: "This ticket already has one: {channel}."
          title: 🔒 Staff channel
    priority:
      description: Set the priority of a ticket
      name: priority
      not_staff:
        description: Only staff members can change the priority of tickets.
        title: ❌ Error
      options:
        priority:
          choices:
            HIGH: 🔴 High
            LOW: 🟢 Low
            MEDIUM: 🟠 Medium
          description: The priority of the ticket
          name: priority
      success:
        description: This ticket's priority has been set to `{priority}`.
        title: ✅ Priority set
    release:
      description: Release (unclaim) a ticket
      name: release
    remove:
      description: Remove a member from a ticket
      name: remove
      not_staff:
        description: Only staff members can remove members from others' tickets.
        title: ❌ Error
      options:
        member:
          description: The member to remove from the ticket
          name: member
        ticket:
          description: The ticket to remove the member from
          name: ticket
      removed: ⬅️ {removed} has been removed by {by}.
      success:
        description: "{member} has been removed from {ticket}."
        title: ✅ Removed
    rename:
      description: Rename a ticket channel
      error: There was an error while renaming the channel.
      invalid:
        description: The name must be between 1 and 100 characters in length.
        title: Invalid name
      name: rename
      not_staff:
        description: Only staff members can rename tickets.
        title: ❌ Error
      options:
        name:
          description: The new name for the ticket channel.
          name: name
      ratelimited:
        description:
          You have already renamed this channel twice within the last 10
          minutes. Please wait before trying again.
        title: Rate Limit Reached
      success:
        description: The ticket channel has been renamed to `{name}`.
        title: Channel renamed
    slowmode:
      description: Set how often members can post in this ticket
      failed:
        description:
          The slow mode could not be changed. Check that the bot still has
          Manage Channels on this ticket.
        title: ❌ Error
      invalid:
        description:
          Give a length of time like `30s`, `10m` or `2h`, up to 6 hours, or
          `off` to turn slow mode off.
        title: Invalid duration
      name: slowmode
      not_staff:
        description: Only staff members can change the slow mode of tickets.
        title: ❌ Error
      options:
        duration:
          description: How long members must wait between messages, e.g. 30s, 10m, 2h, or off
          name: duration
      success:
        cleared:
          description: Members can post in this ticket as often as they like.
          title: ✅ Slow mode off
        set:
          description: Members must now wait {duration} between messages in this ticket.
          title: ✅ Slow mode set
    tag:
      description: Use a tag
      name: tag
      options:
        for:
          description: The user to target the tag to
          name: for
        tag:
          description: The name of the tag to use
          name: tag
    tickets:
      description: List your own or someone else's tickets
      name: tickets
      not_staff:
        description: Only staff members can view others' tickets.
        title: ❌ Error
      options:
        member:
          description: The member to list the tickets of
          name: member
      response:
        description: Use {transcript} to download the transcript of a ticket.
        fields:
          closed:
            name: Closed tickets
            none:
              other: "{user} hasn't made any tickets."
              own: |
                You haven't made any tickets.
                Use {new} to open a ticket.
          open:
            name: Open tickets
        title:
          other: "{displayName}'s tickets"
          own: Your tickets
    topic:
      description: Change the topic of a ticket
      name: topic
    transcript:
      description: Get the transcript of a ticket
      dms_disabled:
        description: This server has disabled direct messages, so transcripts can only be downloaded from within the server.
        title: ❌ Error
      name: transcript
      not_staff:
        description: Only staff members can read the transcripts of others' tickets.
        title: ❌ Error
      options:
        member:
          description: The member to search for tickets of
          name: member
        ticket:
          description: The ticket to get the transcript of
          name: ticket
    transfer:
      description: Transfer ownership of a ticket to another member
      name: transfer
      options:
        member:
          description: The member to transfer ownership to
          name: member
      transferred: 📨 {user} has transferred this ticket to {to}.
      transferred_from: 📨 {user} has transferred this ticket from {from} to {to}.
  user:
    create:
      name: Create ticket for user
      not_staff:
        description: Only staff members can open tickets for other members.
        title: ❌ Error
      prompt:
        description: Click the button below to create a ticket.
        title: Please create a ticket
      sent:
        description: "{user} has been invited to create a ticket in **{category}**."
        title: ✅ Prompt sent
dm:
  closed:
    fields:
      closed:
        name: Closed at
        value: |-
          {timestamp}
          (after {duration})
      closed_by: Closed by
      created: Created at
      feedback: Your feedback
      reason: Closed because
      response: Response time
      ticket: Ticket
      topic: Topic
    title: Your ticket has been closed
  confirm_open:
    title: Do you want to open a ticket with the following topic?
log:
  admin:
    changes: Changes
    description:
      joined: "{user} {verb} {targetType}"
      target:
        automation: an automation
        category: a category
        panel: a panel
        question: a question
        settings: the settings
        tag: a tag
    title:
      joined: "{targetType} {verb}"
      target:
        automation: Automation
        category: Category
        panel: Panel
        question: Question
        settings: Settings
        tag: Tag
    verb:
      create: created
      delete: deleted
      update: updated
  message:
    description: "{user} {verb} a message"
    message: Message
    title: Message {verb}
    verb:
      delete: deleted
      update: updated
  ticket:
    added: Added members
    description: "{user} {verb} a ticket"
    removed: Removed members
    ticket: Ticket
    title: Ticket {verb}
    verb:
      claim: claimed
      close: closed
      create: created
      unclaim: released
      update: updated
menus:
  category:
    placeholder: Select a ticket category
  guild:
    placeholder: Select a server
misc:
  blocked:
    description: You are not allowed to create tickets.
    title: ❌ Blocked
  blocked_roles:
    description: >-
      One of your roles prevents you from creating a ticket in this category.
    title: ❌ Blocked
  category_full:
    description: |
      The category has reached its maximum capacity.
      Please try again later.
    title: ❌ Category full
  cooldown:
    description: Please wait {time} before creating another ticket in this category.
    title: ❌ Please wait
  error:
    description: |
      Sorry, an unexpected error occurred.
      Please give this information to an administrator.
    fields:
      identifier: Identifier
    title: ⚠️ Something went wrong
  expired:
    description: You didn't respond in time. Please try again.
    title: ⏰ Expired
  expires_in: Expires in {time}
  invalid_ticket:
    description: Please specify a valid ticket.
    title: ❌ Invalid ticket
  member_limit:
    description:
      - Please use your existing ticket or close it before creating another.
      - |
        Please close a ticket before creating another.
        Use `/tickets` to view your existing tickets.
    title:
      - ❌ You already have a ticket
      - ❌ You already have %d open tickets
  missing_roles:
    description: >-
      You do not have the roles required to be able to create a ticket in
      this category.
    title: ❌ Insufficient roles
  no_categories:
    description: |-
      No ticket categories have been configured.
      Configure your server at {url}.
    title: ❌ There are no ticket categories
  not_ticket:
    description: You can only use this command in tickets.
    title: ❌ This isn't a ticket channel
  permissions_error:
    description: Sorry, the operation failed due to insufficient permissions.
    fields:
      for_admins:
        name: For server administrators
        value: >
          [Click here]({url}) for resolution instructions.
    title: ⚠️ Something went wrong
  ratelimited:
    description: Try again in a few seconds.
    title: 🐢 Please slow down
  role_error:
    description: Sorry, the operation failed because of an invalid configuration.
    fields:
      for_admins:
        name: For server administrators
        value: >
          An invalid user or role was supplied, which usually means a staff role
          has been deleted. [Click here]({url}) for resolution instructions.
    title: ⚠️ Something went wrong
  unknown_category:
    description: Please try a different category.
    title: ❌ That ticket category doesn't exist
  update:
    description: |
      > [View `{version}` on GitHub]({github})
      > [Changelog]({changelog})
      > [Update guide]({guide})
    title: An update is available
modals:
  feedback:
    comment:
      label: Comment
      placeholder: Do you have any additional feedback?
    rating:
      label: Rating
      placeholder: 1-5
    title: How did we do?
  topic:
    label: Topic
    placeholder: What is this ticket about?
ticket:
  answers:
    no_value: "*No response*"
  claimed: 🙌 {user} has claimed this ticket.
  close:
    cancelled: ↩️ The ticket has been left open.
    closed:
      description: This ticket will be closed in a few seconds…
      title: ✅ Ticket closed
    confirm:
      description: |
        {member} will not be asked — the ticket closes as soon as you confirm.
      title: ❓ Close this ticket?
    forbidden:
      description: You don't have permission to close this ticket.
      title: ❌ Error
    rejected: ✋ {user} rejected a request to close this ticket.
    staff_request:
      archived: |

        The messages in this channel will be archived for future reference.
      description: |
        {requestedBy} wants to close this ticket.
        Click "Accept" to close it now, or "Reject" if you still need help.
      title: ❓ Can this ticket be closed?
    user_request:
      title: ❓ {requestedBy} wants to close this ticket
    wait_for_staff: ✋ Please wait for staff to close this ticket.
    wait_for_user: ✋ Please wait for the user to respond.
  closing_soon:
    description: |
      This ticket will be closed due to inactivity <t:{timestamp}:R>.
      Send a message to cancel this automation.
    title: ⌛ This ticket will be closed soon
  created:
    description: "Your ticket channel has been created: {channel}."
    title: ✅ Ticket created
  edited:
    description: Your changes have been saved.
    title: ✅ Ticket updated
  feedback: Thank you for your feedback.
  inactive:
    description: |
      There hasn't been any activity in this channel since <t:{timestamp}:R>.
      Please continue the conversation or {close} the ticket.
    title: ⏰ This ticket is inactive
  offline:
    description:
      There aren't any staff members available at the moment, so it may
      take longer than usual to get a response.
    title: 😴 We're not online
  opening_message:
    content: |
      {staff}
      {creator} has created a new ticket
    fields:
      topic: Topic
  references_message:
    description: References [a message]({url}) sent {timestamp} by {author}.
    title: ℹ️ Reference
  references_ticket:
    description: "This ticket is related to a previous ticket:"
    fields:
      date: Created at
      number: Number
      topic: Topic
    title: ℹ️ Reference
  released: ♻️ {user} has released this ticket.
  reopen:
    closed:
      description: |
        This ticket has been closed and will be removed <t:{timestamp}:R>.
        Click the button below to reopen it.
      title: 🔒 Ticket closed
    no_window:
      description: The reopen window for this ticket has expired or doesn't exist.
      title: ❌ This ticket can't be reopened
    not_allowed:
      description: Only the ticket creator or staff can reopen this ticket.
      title: ❌ You can't reopen this ticket
    reopened:
      description: "{user} reopened this ticket."
      title: 🔓 Ticket reopened
  working_hours:
    next:
      description:
        We'll be back at <t:{timestamp}:F> (<t:{timestamp}:R>), although
        you may receive a response before then.
      title: 🕗 We're not working at the moment
    today:
      description:
        You may receive a response before, but we don't start working until
        <t:{timestamp}:t> today (<t:{timestamp}:R>).
      title: 🕗 We're not working at the moment
