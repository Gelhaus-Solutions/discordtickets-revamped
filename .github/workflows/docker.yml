name: Publish Docker image

# Development builds:
#   - push to any branch -> ghcr.io/<owner>/<repo>:<branch>
#   - pull request       -> ghcr.io/<owner>/<repo>:pr-<number>
# Fork PRs still build without pushing, as a build-health check.
# Tagged releases are handled by release-docker.yml.

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build & push development image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Upload browser source maps for the dashboard. When these repository
          # secrets are unset they arrive empty, the Vite plugin is skipped, and
          # the build simply produces no maps — so forks need no configuration.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            sentry_org=${{ secrets.SENTRY_ORG }}
            sentry_project=${{ secrets.SENTRY_PROJECT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
