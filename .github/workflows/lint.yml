name: Lint

on: [push, pull_request]

permissions:
  contents: read

env:
  # scripts/postinstall builds the dashboard when the bundle is missing, which
  # every `npm ci` below would otherwise trigger. These jobs check the bot; the
  # dashboard-build job is what checks the dashboard.
  DT_SKIP_DASHBOARD_BUILD: 'true'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The commitlint config lives in the "commitlint" key of package.json,
      # so no configFile is passed here.
      - uses: wagoid/commitlint-github-action@v6

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: CI=true npm ci
      - run: npx eslint src scripts

  typecheck:
    name: Typecheck (Temporal layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: CI=true npm ci
      # src/temporal/**/*.ts is excluded from eslint (see eslint.config.mjs),
      # so TypeScript is the only thing checking it.
      - run: npm run temporal.typecheck
      # The bot cannot start without dist/temporal, and release tarballs ship it
      # prebuilt — so a build that only breaks at release time is too late.
      - run: npm run temporal.build

  dashboard-build:
    name: Dashboard builds
    runs-on: ubuntu-latest
    # src/dashboard/build/ is not committed: the Dockerfile's `dashboard` stage
    # and release-tarball.yml build it for the two artefacts anyone installs,
    # and scripts/postinstall builds it on a fresh clone. This job is what
    # proves the source still compiles before either of those runs for real.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/dashboard/package-lock.json
      # --include=dev: vite and SvelteKit are devDependencies of the dashboard.
      - working-directory: src/dashboard
        run: npm ci --include=dev --no-audit --no-fund
      - working-directory: src/dashboard
        run: npm run build
      # `vite build` can exit 0 having emitted nothing useful if the adapter is
      # misconfigured, and this path is what src/http.js imports.
      - run: test -f src/dashboard/build/handler.js

  schema-drift:
    name: Prisma schema matches migrations
    runs-on: ubuntu-latest
    # `prisma migrate deploy` does not detect drift, so a schema.prisma that has
    # diverged from its migration history goes unnoticed until someone runs
    # `migrate dev` and is offered a database reset. This catches it in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shadow
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: CI=true npm ci
      - name: PostgreSQL
        run: |
          npx prisma migrate diff \
            --from-migrations db/postgresql/migrations \
            --to-schema-datamodel db/postgresql/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code
      - name: MySQL
        run: |
          npx prisma migrate diff \
            --from-migrations db/mysql/migrations \
            --to-schema-datamodel db/mysql/schema.prisma \
            --shadow-database-url mysql://root:root@localhost:3306/shadow \
            --exit-code

  tests:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: CI=true npm ci
      # Needs a generated Prisma client: check-importable reads the datamodel
      # to prove the import allow-lists still cover every column.
      - run: npx prisma generate --schema db/postgresql/schema.prisma
      - run: npm test
