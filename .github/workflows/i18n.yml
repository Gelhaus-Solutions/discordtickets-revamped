name: 'Check localisations'

on:
  workflow_dispatch:
  push:
    # branches:
    #   - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  # This job reads locale files; it has no use for a SvelteKit bundle, which
  # scripts/postinstall would otherwise build during `npm ci`.
  DT_SKIP_DASHBOARD_BUILD: 'true'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: CI=true npm ci

      - name: Validate localisations
        run: node ./scripts/check-i18n.js
